<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>訓練紀錄 | Fitness App</title>
  <link rel="stylesheet" href="./css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      font-family: "Microsoft JhengHei", sans-serif;
      background-color: #fafafa;
      margin: 0;
      padding: 0;
    }
    .nav {
      background-color: #fff;
      border-bottom: 1px solid #ddd;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .nav .brand { font-weight: 600; font-size: 20px; }
    .nav a { text-decoration: none; color: #444; margin-left: 16px; }
    .nav a.active { color: #198754; font-weight: bold; }
    .container {
      max-width: 900px;
      margin: 40px auto;
      background: #fff;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }
    h1 { text-align: center; margin-bottom: 24px; }
    .selector {
      display: flex; flex-wrap: wrap; gap: 10px;
      justify-content: center; margin-bottom: 24px;
    }
    select, button { padding: 8px 12px; border-radius: 6px; border: 1px solid #ccc; }
    #exerciseContainer { margin-top: 20px; }
    .btn-group button { margin-right: 8px; border: none; border-radius: 6px; padding: 6px 12px; cursor: pointer; color: #fff; font-weight: bold; }
    .add-btn { background-color: #28a745; }
    .keep-btn { background-color: #007bff; }
    .reduce-btn { background-color: #dc3545; }
  </style>
</head>

<body>
  <nav class="nav">
    <div class="brand">🏋️ Fitness App</div>
    <div class="links">
      <a href="./index.html">首頁</a>
      <a href="./profile.html">建立個人資料</a>
      <a href="./recommend.html">今日推薦</a>
      <a href="./training.html" class="active">訓練紀錄</a>
    </div>
  </nav>

  <main class="container">
    <h1>訓練紀錄</h1>

<div class="text-center mb-4">
      <p style="font-size: 18px; color:#444; margin-bottom: 12px;">
  若是跳過今日推薦直接進入訓練紀錄頁面，請先選擇要訓練的目標與部位。
</p>
  
      <label for="goalSelect">訓練目標：</label>
      <select id="goalSelect">
        <option value="">請選擇</option>
        <option value="增肌">增肌</option>
        <option value="力量">力量</option>
        <option value="減脂">減脂</option>
        <option value="耐力">耐力</option>
      </select>
      
<label for="partSelect">訓練部位：</label>
<select id="partSelect">
  <option value="">請選擇</option>
  <option value="胸部">胸部</option>
  <option value="背部">背部</option>
  <option value="腿部">腿部</option>
  <option value="肩部">肩部</option>
  <option value="二頭肌">手部▫ 二頭肌（Biceps）</option>
  <option value="三頭肌">三頭肌（Triceps）</option>
  <option value="核心">核心</option>
</select>

      <button id="loadBtn">載入菜單</button>
    </div>

    <section id="exerciseList">
     
      <div class="card" style="padding:20px; margin-top:20px; text-align:center;">
  <a href="https://fitness-video-app222.onrender.com/"
     target="_blank"
     style="display:inline-block; background-color:#198754; color:white;
            padding:10px 20px; border-radius:8px; text-decoration:none;
            font-weight:bold; font-size:17px;">
    🎥 前往健身影片查詢系統
  </a>
</div>
 <h2 style="text-align:center;">訓練菜單</h2>
      
        <!-- 🧾 新手操作說明（放在這裡） -->
  <div style="
    max-width: 620px;
    margin: 0 auto 20px;
    padding: 10px 16px;
    border-radius: 8px;
    background:#f8f9fa;
    font-size: 20px;
    line-height: 1.6;
    color:#555;
  ">
    <b>如何使用訓練紀錄：</b><br>
    ① 依照推薦重量完成本次訓練。<br>
    ② 在做每個動作後，依照感受按一下
    <span style="color:#198754;">【加重】</span>、
    <span style="color:#0d6efd;">【維持】</span> 或
    <span style="color:#dc3545;">【減重】</span>。<br>
    ③ 系統會記錄你的選擇並更新下一次的推薦重量，最後按下最下方的
    <b>「✅ 完成訓練」</b> 儲存今天的總重量。
  </div>
      <div id="exerciseContainer"></div>
    </section>
  </main>
<!-- 🔵 自訂 Confirm 彈窗（通用） -->
<div id="confirmOverlay" style="
  position: fixed; inset: 0; background: rgba(0,0,0,0.4); 
  display: none; align-items: center; justify-content: center;
">
  <div style="background: white; padding: 20px; border-radius: 10px; width: 300px; text-align:center;">
    <p id="confirmMessage" style="font-size:16px; margin-bottom:20px;"></p>

    <button id="confirmNo" 
      style="background:#0d6efd; color:white; padding:8px 20px; border-radius:6px; border:none; margin-right:10px;">
      否
    </button>

    <button id="confirmYes"
      style="background:#e9ecef; color:#333; padding:8px 20px; border-radius:6px; border:none;">
      是
    </button>
  </div>
</div>

  <!-- 保留 firebase.js 沒關係，training.js 自己也會初始化 Firebase -->
  <script type="module" src="js/firebase.js"></script>
  <script type="module" src="js/training.js"></script>
</body>
</html>
