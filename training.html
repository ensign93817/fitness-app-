<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>訓練推薦 | Fitness App</title>
  <link rel="stylesheet" href="./css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      font-family: "Microsoft JhengHei", sans-serif;
      background-color: #fafafa;
      margin: 0;
      padding: 0;
    }
    .nav {
      background-color: #fff;
      border-bottom: 1px solid #ddd;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .nav .brand { font-weight: 600; font-size: 20px; }
    .nav a { text-decoration: none; color: #444; margin-left: 16px; }
    .nav a.active { color: #198754; font-weight: bold; }
    .container {
      max-width: 900px;
      margin: 40px auto;
      background: #fff;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }
    h1 { text-align: center; margin-bottom: 24px; }
    .selector {
      display: flex; flex-wrap: wrap; gap: 10px;
      justify-content: center; margin-bottom: 24px;
    }
    select, button { padding: 8px 12px; border-radius: 6px; border: 1px solid #ccc; }
    #exerciseContainer { margin-top: 20px; }
    .btn-group button { margin-right: 8px; border: none; border-radius: 6px; padding: 6px 12px; cursor: pointer; color: #fff; font-weight: bold; }
    .add-btn { background-color: #28a745; }
    .keep-btn { background-color: #007bff; }
    .reduce-btn { background-color: #dc3545; }
  </style>
</head>

<body>
  <nav class="nav">
    <div class="brand">🏋️ Fitness App</div>
    <div class="links">
      <a href="./index.html">首頁</a>
      <a href="./profile.html">建立個人資料</a>
      <a href="./training.html" class="active">訓練推薦</a>
    </div>
  </nav>

  <main class="container">
    <h1>訓練推薦</h1>
    
 <!-- ⭐ 今日推薦區塊（新增） -->
    <section id="recommendSection" style="margin-bottom: 24px; padding: 16px; border-radius: 8px; background:#f5f5f5;">
      <h2 style="margin-top:0; font-size:20px;">今日推薦</h2>
      <p id="recommendText">正在讀取上次訓練紀錄...</p>
      <div style="margin-top: 12px;">
        <button id="applyRecommendBtn" style="padding:6px 12px; border-radius:6px; border:none; background:#198754; color:#fff; font-weight:bold; cursor:pointer;">
          ✅ 套用推薦菜單
        </button>
        <button id="skipRecommendBtn" style="padding:6px 12px; border-radius:6px; border:1px solid #ccc; background:#fff; margin-left:8px; cursor:pointer;">
          我想自己選
        </button>
      </div>
    </section>
    <!-- ⭐ 今日推薦區塊結束 -->
    
    <div class="selector">
      <label for="goalSelect">訓練目標：</label>
      <select id="goalSelect">
        <option value="">請選擇</option>
        <option value="增肌">增肌</option>
        <option value="力量">力量</option>
        <option value="減脂">減脂</option>
        <option value="耐力">耐力</option>
      </select>

      <label for="partSelect">訓練部位：</label>
      <select id="partSelect">
        <option value="">請選擇</option>
        <option value="胸部">胸部</option>
        <option value="背部">背部</option>
        <option value="腿部">腿部</option>
        <option value="肩部">肩部</option>
        <option value="二頭肌">二頭肌</option>
        <option value="三頭肌">三頭肌</option>
        <option value="核心">核心</option>
      </select>

      <button id="loadBtn">載入菜單</button>
    </div>

    <section id="exerciseList">
      <h2 style="text-align:center;">訓練菜單</h2>
      <div id="exerciseContainer"></div>
    </section>
  </main>

  <!-- ✅ 把所有 JS 放在最後，確保 DOM 先載完 -->
  <script type="module" src="js/firebase.js"></script>
  <script type="module" src="js/training.js"></script>
</body>
</html>
