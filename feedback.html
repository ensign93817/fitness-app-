<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>訓練回顧 | Fitness App</title>
  <link rel="stylesheet" href="./css/style.css" />

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      font-family: "Microsoft JhengHei", sans-serif;
      background-color: #fafafa;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #fff;
      border-bottom: 1px solid #ddd;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header .brand { font-weight: 600; font-size: 20px; }
    header a { text-decoration: none; color: #444; margin-left: 16px; }
    header a.active { color: #198754; font-weight: bold; }

    .container {
      max-width: 900px;
      margin: 40px auto;
      background: #fff;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    h1 { text-align: center; margin-bottom: 20px; }

    .hint-box {
      max-width: 700px;
      margin: 0 auto 20px;
      padding: 10px 16px;
      border-radius: 8px;
      background:#f8f9fa;
      font-size: 14px;
      line-height: 1.7;
      color:#555;
    }

    .summary-row {
      font-size: 14px;
      margin-bottom: 20px;
      color:#555;
    }

    .card {
      background:#f7f7f7;
      border-radius:8px;
      padding:16px 18px;
      margin-bottom:24px;
    }

    .card h3 {
      margin:0 0 4px 0;
      font-size:16px;
    }

    .card small {
      color:#777;
      font-size:12px;
    }

    .comment {
      margin-top:8px;
      font-size:14px;
      color:#444;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">🏋️ Fitness App</div>
    <nav>
      <a href="./index.html">首頁</a>
      <a href="./profile.html">建立個人資料</a>
      <a href="./recommend.html">今日推薦</a>
      <a href="./training.html">訓練紀錄</a>
      <a href="./feedback.html" class="active">訓練回顧</a>
    </nav>
  </header>

  <main class="container">
    <h1>訓練回顧</h1>

    <div class="summary-row">
<p>👤 使用者：<span id="userNameText">載入中...</span></p>
<p>📅 最近一次訓練：<span id="lastTrainingText">讀取中...</span></p>

    </div>

    <!-- 🧾 長期歷史使用說明 -->
    <div class="hint-box">
      <b>如何看這個回顧頁面？</b><br>
      ① 每一張圖代表一個訓練動作，最多顯示 <b>最近 30 次</b> 的重量紀錄。<br>
      ② 每次在訓練紀錄頁面按下
      <span style="color:#198754;">【加重】</span>、
      <span style="color:#0d6efd;">【維持】</span> 或
      <span style="color:#dc3545;">【減重】</span>，
      系統都會幫你留下當下的重量。<br>
      ③ 線條往上代表最近有慢慢加重，維持代表穩定訓練，往下則可能是調整姿勢或太累，
      記得好好休息，下次再加油就好。💪
    </div>

    <!-- 各動作的長期圖表 -->
    <section id="feedbackContainer">
      載入中...
    </section>
    <div style="text-align:center; margin-top:40px; margin-bottom:30px;">
  <a href="./index.html"
     style="
       display:inline-block;
       background-color:#198754;
       color:white;
       padding:12px 26px;
       border-radius:8px;
       text-decoration:none;
       font-weight:bold;
       font-size:16px;
     ">
    ⬅️ 回到首頁
  </a>
</div>

  </main>
<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- 一定要加 type="module" -->
<script type="module" src="js/feedback.js"></script>
</body>
</html>
