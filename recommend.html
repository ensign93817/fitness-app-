<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>今日推薦 | Fitness App</title>
  <link rel="stylesheet" href="./css/style.css" />
  <style>
    body {
      font-family: "Microsoft JhengHei", sans-serif;
      background-color: #fafafa;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #fff;
      border-bottom: 1px solid #ddd;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header .brand { font-weight: 600; font-size: 20px; }
    header a { text-decoration: none; color: #444; margin-left: 16px; }
    header a.active { color: #198754; font-weight: bold; }

    .container {
      max-width: 900px;
      margin: 40px auto;
      background: #fff;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    h1 { text-align: center; margin-bottom: 24px; }

    .card {
      background:#f7f7f7;
      border-radius:8px;
      padding:20px;
      margin-bottom:24px;
    }

    .btn {
      padding: 8px 14px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-primary {
      background:#198754;
      color:#fff;
    }
    .btn-outline {
      background:#fff;
      border:1px solid #ccc;
      color:#333;
    }

    #manualArea {
      margin-top:14px;
      padding-top:12px;
      border-top:1px dashed #ccc;
      display:none;
    }
    #manualArea label {
      margin-right:6px;
    }
    #manualArea select {
      margin-right:12px;
      padding:4px 8px;
      border-radius:6px;
      border:1px solid #ccc;
    }

    #menuContainer > div {
      margin-bottom:10px;
      padding:8px 10px;
      border-radius:6px;
      background:#fafafa;
      border:1px solid #eee;
    }
    #menuContainer h3 {
      margin:0 0 4px 0;
      font-size:16px;
    }
    #menuContainer p {
      margin:2px 0;
      font-size:14px;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">🏋️ Fitness App</div>
    <nav>
      <a href="./index.html">首頁</a>
      <a href="./profile.html">建立個人資料</a>
      <a href="./recommend.html" class="active">今日推薦</a>
      <a href="./training.html">訓練紀錄</a>
    </nav>
  </header>

  <main class="container">
    <h1>今日推薦</h1>

    <!-- 🔹 推薦摘要卡片 -->
    <section class="card">
      <p>👤 當前使用者：<b id="userNameText">載入中...</b></p>
      <p>📌 上次訓練：<span id="lastTrainingText">讀取中...</span></p>
      <p>✅ 今天建議：目標 <b id="todayGoalText">-</b>，部位 <b id="todayPartText">-</b></p>

      <div style="margin-top:12px;">
        <button id="acceptBtn" class="btn btn-primary">✅ 接受推薦，開始訓練</button>
        <button id="manualBtn" class="btn btn-outline">✏️ 我想自己選</button>
      </div>

      <!-- ✏️ 在今日推薦頁面直接改目標與部位 -->
      <div id="manualArea">
        <p style="margin:8px 0;">手動調整今日訓練目標與部位：</p>
        <label for="manualGoal">訓練目標：</label>
        <select id="manualGoal">
          <option value="增肌">增肌</option>
          <option value="力量">力量</option>
          <option value="減脂">減脂</option>
          <option value="耐力">耐力</option>
        </select>

        <label for="manualPart">訓練部位：</label>
        <select id="manualPart">
          <option value="胸部">胸部</option>
          <option value="背部">背部</option>
          <option value="腿部">腿部</option>
          <option value="肩部">肩部</option>
          <option value="二頭肌">二頭肌</option>
          <option value="三頭肌">三頭肌</option>
          <option value="核心">核心</option>
        </select>

        <button id="applyManualBtn" class="btn btn-primary" style="margin-top:6px;">
          重新套用條件
        </button>
      </div>
    </section>

  <!-- 🔹 推薦菜單預覽（只列動作資料，不含按鈕與折線圖） -->
<section>
  <h2>推薦訓練菜單</h2>

  <!-- 🧾 新手操作說明（放在這裡） -->
  <div style="
    max-width: 620px;
    margin: 0 auto 20px;
    padding: 10px 16px;
    border-radius: 8px;
    background:#f8f9fa;
    font-size: 20px;
    line-height: 1.6;
    color:#555;
  ">
    <b>如何使用訓練紀錄：</b><br>
    ① 依照推薦重量完成本次訓練。<br>
    ② 在做每個動作後，依照感受按一下
    <span style="color:#198754;">【加重】</span>、
    <span style="color:#0d6efd;">【維持】</span> 或
    <span style="color:#dc3545;">【減重】</span>。<br>
    ③ 系統會記錄你的選擇並更新下一次的推薦重量，最後按下最下方的
    <b>「✅ 完成訓練」</b> 儲存今天的總重量。
  </div>

  <div id="menuContainer">正在載入菜單...</div>
</section>

  </main>

  <script type="module" src="js/recommend.js"></script>
</body>
</html>
