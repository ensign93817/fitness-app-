<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>健身訓練推薦系統 | Fitness App</title>
  <link rel="stylesheet" href="./css/style.css" />
  <style>
    body {
      font-family: "Noto Sans TC", sans-serif;
      background-color: #fafafa;
      color: #222;
      margin: 0;
      padding: 0;
    }

    /* 導覽列 */
    header {
      background-color: #fff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 20px;
      color: #333;
      margin: 0;
    }

    nav a {
      text-decoration: none;
      margin-left: 20px;
      color: #444;
      font-weight: 500;
      transition: color 0.2s ease;
    }

    nav a:hover {
      color: #007bff;
    }

    nav a.active {
      color: #007bff;
      font-weight: 700;
    }

    /* 主內容卡片 */
    main {
      max-width: 800px;
      margin: 40px auto;
      background-color: #fff;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
    }

    h2 {
      color: #222;
      margin-bottom: 10px;
    }

    p {
      line-height: 1.8;
      margin-bottom: 15px;
    }

    ul {
      padding-left: 20px;
    }

    /* 按鈕區塊 */
    .button-group {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin-top: 25px;
    }

    .btn-link {
      text-decoration: none;
      display: inline-block;
      padding: 12px 28px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      color: white;
      background-color: #007bff;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.1);
      transition: all 0.2s;
    }

    .btn-link:hover {
      background-color: #0056d2;
      transform: translateY(-2px);
    }

    /* 管理員登入小字 */
    .admin-link {
      text-align: center;
      margin-top: 80px;
      padding-bottom: 40px;
    }

    .admin-link a {
      font-size: 12px;
      color: #888;
      text-decoration: none;
    }

    .admin-link a:hover {
      color: #555;
    }

    footer {
      text-align: center;
      margin-top: 60px;
      font-size: 14px;
      color: #666;
    }
  </style>
</head>
<body>
  <!-- 🔹 導覽列 -->
<header>

</header>

  <!-- 🔸 主內容 -->

    <p>白底、簡潔、以「先選目標＋部位 → 讀取菜單 → 紀錄訓練 → 訓後回饋」為核心流程。</p>

    <h3>訓練原則</h3>
    <ul>
      <li>優先複合動作，逐步超負荷。</li>
      <li>明確記錄組數 × 次數 × 重量。</li>
      <li>訓練後填寫回饋以優化下一次推薦。</li>
    </ul>

  </a>

    <div class="admin-link">

  </main>

  <footer>
    © 2025 Fitness App
  </footer>
</body>
</html>
